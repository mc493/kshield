apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: kshield-kernel-hardening
  namespace: kube-system
  labels:
    app.kubernetes.io/name: kshield
    app.kubernetes.io/component: kernel-defense
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: kshield
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kshield
    spec:
      hostNetwork: true
      hostPID: true
      tolerations:
      - operator: Exists
        effect: NoSchedule
      - operator: Exists
        effect: NoExecute
      initContainers:
      - name: kshield-enforce-init
        image: busybox:1.36
        securityContext:
          privileged: true
        command:
        - /bin/sh
        - -c
        - |
          set -e
          echo "[KSHIELD] Initializing Host Kernel Hardening & Seccomp Profiles..."

          # 1. Install Seccomp Profile
          mkdir -p /host/var/lib/kubelet/seccomp
          cp /profiles/seccomp-kshield-default.json /host/var/lib/kubelet/seccomp/seccomp-kshield-default.json
          chmod 644 /host/var/lib/kubelet/seccomp/seccomp-kshield-default.json
          echo "  [OK] Installed Seccomp profile to /var/lib/kubelet/seccomp/seccomp-kshield-default.json"

          # 2. Configure Host Modprobe Blacklist (Volatile /run/modprobe.d Ingress)
          mkdir -p /host/run/modprobe.d
          cat << 'EOF' > /host/run/modprobe.d/kshield-disarm.conf
          # Auto-generated by Project Aegis-Kernel (UKDF)
          install dccp /bin/true
          install sctp /bin/true
          install rds /bin/true
          install tipc /bin/true
          install ax25 /bin/true
          install netrom /bin/true
          install x25 /bin/true
          install rose /bin/true
          install decnet /bin/true
          install econet /bin/true
          install af_802154 /bin/true
          install appletalk /bin/true
          install ipx /bin/true
          install can /bin/true
          install atm /bin/true
          install cramfs /bin/true
          install freevxfs /bin/true
          install jffs2 /bin/true
          install hfs /bin/true
          install hfsplus /bin/true
          install udf /bin/true
          install gfs2 /bin/true
          install reiserfs /bin/true
          install ebtables /bin/true
          install ebtable_nat /bin/true
          install ebtable_filter /bin/true
          install ebtable_broute /bin/true
          install arp_tables /bin/true
          install arptable_filter /bin/true
          install firewire-core /bin/true
          install floppy /bin/true

          blacklist dccp
          blacklist sctp
          blacklist rds
          blacklist tipc
          blacklist ax25
          blacklist netrom
          blacklist x25
          blacklist rose
          blacklist decnet
          blacklist econet
          blacklist appletalk
          blacklist ipx
          blacklist can
          blacklist atm
          blacklist cramfs
          blacklist freevxfs
          blacklist jffs2
          blacklist hfs
          blacklist hfsplus
          blacklist udf
          blacklist gfs2
          blacklist reiserfs
          blacklist ebtables
          blacklist ebtable_nat
          blacklist arp_tables
          blacklist arptable_filter
          EOF
          chmod 644 /host/run/modprobe.d/kshield-disarm.conf
          echo "  [OK] Sealed dormant attack surface modules via /run/modprobe.d/"

          # Mirror to /etc/modprobe.d only if host filesystem is writeable
          if [ -w /host/etc/modprobe.d ]; then
            cp /host/run/modprobe.d/kshield-disarm.conf /host/etc/modprobe.d/kshield-disarm.conf 2>/dev/null || true
          fi

          # 3. Apply Host Sysctl Hardening (Volatile /run/sysctl.d Ingress)
          mkdir -p /host/run/sysctl.d
          cat << 'EOF' > /host/run/sysctl.d/99-kshield.conf
          kernel.unprivileged_bpf_disabled = 1
          kernel.kptr_restrict = 2
          kernel.dmesg_restrict = 1
          kernel.yama.ptrace_scope = 2
          kernel.kexec_load_disabled = 1
          vm.unprivileged_userfaultfd = 0
          fs.protected_symlinks = 1
          fs.protected_hardlinks = 1
          fs.protected_fifos = 2
          fs.protected_regular = 2
          kernel.perf_event_paranoid = 2
          EOF
          chmod 644 /host/run/sysctl.d/99-kshield.conf
          echo "  [OK] Staged sysctl hardening baseline via /run/sysctl.d/"

          # Mirror to /etc/sysctl.d only if host filesystem is writeable
          if [ -w /host/etc/sysctl.d ]; then
            cp /host/run/sysctl.d/99-kshield.conf /host/etc/sysctl.d/99-kshield.conf 2>/dev/null || true
          fi

          # Apply all 11 critical sysctls to running kernel if writeable
          for item in \
            "kernel/unprivileged_bpf_disabled:1" \
            "kernel/kptr_restrict:2" \
            "kernel/dmesg_restrict:1" \
            "kernel/yama/ptrace_scope:2" \
            "kernel/kexec_load_disabled:1" \
            "vm/unprivileged_userfaultfd:0" \
            "fs/protected_symlinks:1" \
            "fs/protected_hardlinks:1" \
            "fs/protected_fifos:2" \
            "fs/protected_regular:2" \
            "kernel/perf_event_paranoid:2"; do
            p_path="${item%%:*}"
            p_val="${item##*:}"
            if [ -w "/host/proc/sys/${p_path}" ]; then
              echo "${p_val}" > "/host/proc/sys/${p_path}" 2>/dev/null || true
            fi
          done

          # Trigger host sysctl processor if chroot sysctl is available
          if chroot /host command -v sysctl >/dev/null 2>&1; then
            chroot /host sysctl -p /run/sysctl.d/99-kshield.conf >/dev/null 2>&1 || true
          fi
          echo "  [OK] Host sysctls asserted into kernel memory"
          echo "[KSHIELD] Node Kernel Defenses Synchronized Successfully."
        volumeMounts:
        - name: host-root
          mountPath: /host
          mountPropagation: HostToContainer
        - name: host-run
          mountPath: /host/run
        - name: host-proc
          mountPath: /host/proc
        - name: seccomp-profile
          mountPath: /profiles
      containers:
      - name: pause
        image: registry.k8s.io/pause:3.9
        resources:
          limits:
            cpu: 10m
            memory: 16Mi
          requests:
            cpu: 2m
            memory: 8Mi
      volumes:
      - name: host-root
        hostPath:
          path: /
      - name: host-run
        hostPath:
          path: /run
      - name: host-proc
        hostPath:
          path: /proc
      - name: seccomp-profile
        configMap:
          name: kshield-seccomp-profile
